<article class="post">
  <header class="post-head">
    <p class="post-meta">
      <time datetime="{{date_iso}}">{{date_label}}</time>
      {{category_links}}
    </p>
    <h1 class="post-title">{{title}}</h1>
  </header>
  <div class="post-body">
{{body}}
  </div>
{{tag_links}}
</article>
<nav class="post-nav">
  {{prev_link}}
  {{next_link}}
</nav>
